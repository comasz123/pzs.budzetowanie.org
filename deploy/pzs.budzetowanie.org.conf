<VirtualHost *:80>
    ServerName pzs.budzetowanie.org

    Alias /.well-known/acme-challenge/ /var/www/pzs.budzetowanie.org/html/.well-known/acme-challenge/
    <Directory /var/www/pzs.budzetowanie.org/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/pzs.budzetowanie.org-error.log
    CustomLog ${APACHE_LOG_DIR}/pzs.budzetowanie.org-access.log combined
</VirtualHost>
