<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName pzs.budzetowanie.org

    <Location />
        # 10.10.30.10 Katarzyna, 10.10.30.11 admin, 10.10.30.12 Joanna
        Require ip 10.10.30.10/32 10.10.30.11/32 10.10.30.12/32 127.0.0.1
    </Location>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/

    ErrorLog ${APACHE_LOG_DIR}/pzs.budzetowanie.org-error.log
    CustomLog ${APACHE_LOG_DIR}/pzs.budzetowanie.org-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/pzs.budzetowanie.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pzs.budzetowanie.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
