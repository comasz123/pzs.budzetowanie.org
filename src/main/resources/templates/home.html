<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <title>Pulpit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .start-choice {
            display: block;
            padding: 1.35rem 1.5rem;
            border: 1px solid #dee2e6;
            border-radius: 0.75rem;
            background: #fff;
            color: #212529;
            font-size: 1.15rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.04);
        }
        .start-choice:hover,
        .start-choice:focus {
            border-color: #0d6efd;
            color: #0d6efd;
            box-shadow: 0 0.25rem 0.75rem rgba(13, 110, 253, 0.12);
        }
        .home-chart {
            position: relative;
            height: 22rem;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<div class="container py-5 flex-grow-1">
    <div class="mx-auto w-100" style="max-width: 64rem;">
        <div class="mx-auto" style="max-width: 36rem;">
            <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
                <div>
                    <h1 class="h3 mb-1">Pulpit</h1>
                    <div th:if="${currentOrganization != null}" class="text-muted">
                        <span th:text="${currentOrganization.name}">Fundacja</span>
                        <span th:if="${currentOrganization.demo}" class="badge text-bg-warning ms-1">Demo</span>
                    </div>
                </div>
                <form th:if="${userAuthenticated}" th:action="@{/logout}" method="post" class="mb-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-link btn-sm text-muted p-0">Wyloguj</button>
                </form>
            </div>
            <div class="d-grid gap-3">
                <a class="start-choice" th:href="@{/dashboard}">Budżet Organizacji i Pokrycie Grantowe</a>
                <a class="start-choice" th:href="@{/realizacja}">Realizacja budżetu</a>
            </div>
        </div>
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h6 mb-0">
                        Budżet
                        <span th:text="${chart.year}">2026</span>
                    </h2>
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/export(year=${chart.year})}">Excel</a>
                </div>
                <div class="home-chart">
                    <canvas id="home-cashflow-chart"
                            th:attr="aria-label=|Wpływy, planowany koszt i saldo narastające w ${chart.year}|"
                            role="img"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: budget-footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    (function () {
        const months = /*[[${chart.months}]]*/ [];
        const income = /*[[${chart.income}]]*/ [];
        const plannedCost = /*[[${chart.plannedCost}]]*/ [];
        const canvas = document.getElementById('home-cashflow-chart');
        if (!canvas || typeof Chart === 'undefined') {
            return;
        }

        function cents(value) {
            return Math.round(Number(value) * 100);
        }

        let runningCents = 0;
        const balance = [0];
        for (let i = 0; i < income.length; i++) {
            runningCents += cents(income[i]) - cents(plannedCost[i]);
            balance.push(runningCents / 100);
        }
        balance.push(runningCents / 100);

        const labels = ['01 Jan'].concat(months, ['31 Dec']);
        const barIncome = [null].concat(income, [null]);
        const barCost = [null].concat(plannedCost, [null]);

        function formatPln(value, digits) {
            return new Intl.NumberFormat('pl-PL', {
                minimumFractionDigits: digits,
                maximumFractionDigits: digits
            }).format(value) + ' zł';
        }

        new Chart(canvas, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Wpływy',
                        data: barIncome,
                        backgroundColor: '#0d6efd',
                        borderRadius: 3,
                        maxBarThickness: 28,
                        order: 2
                    },
                    {
                        label: 'Planowany koszt',
                        data: barCost,
                        backgroundColor: '#198754',
                        borderRadius: 3,
                        maxBarThickness: 28,
                        order: 2
                    },
                    {
                        type: 'line',
                        label: 'Saldo narastająco',
                        data: balance,
                        borderColor: '#dc3545',
                        backgroundColor: '#dc3545',
                        tension: 0,
                        borderWidth: 2,
                        pointRadius: 3,
                        pointHoverRadius: 4,
                        fill: false,
                        order: 1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom'
                    },
                    tooltip: {
                        filter: function (item) {
                            return item.parsed.y != null;
                        },
                        callbacks: {
                            label: function (context) {
                                return context.dataset.label + ': ' + formatPln(context.parsed.y, 2);
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { display: false }
                    },
                    y: {
                        ticks: {
                            callback: function (value) {
                                return formatPln(value, 0);
                            }
                        }
                    }
                }
            }
        });
    })();
</script>
</body>
</html>
