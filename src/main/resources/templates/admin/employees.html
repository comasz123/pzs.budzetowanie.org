<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <title>Pracownicy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container-fluid px-4 py-3">
    <div th:replace="~{fragments/admin :: header('Pracownicy', ${activeSection})}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="text-muted mb-0">Lista pracowników</p>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{__${adminBase}__/employees/export}">Excel</a>
            <a class="btn btn-primary btn-sm" th:href="@{__${adminBase}__/employees/new}">Dodaj pracownika</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover table-sm mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Imię i nazwisko</th>
                    <th>Stanowisko</th>
                    <th>E-mail</th>
                    <th>Telefon</th>
                    <th class="text-end">Planowany koszt</th>
                    <th class="text-end">Akcje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="employee : ${employees}">
                    <td th:text="${employee.firstName + ' ' + employee.lastName}">Jan Kowalski</td>
                    <td th:text="${employee.position != null ? employee.position : '-'}">Stanowisko</td>
                    <td th:text="${employee.email != null ? employee.email : '-'}">E-mail</td>
                    <td th:text="${employee.phone != null ? employee.phone : '-'}">Telefon</td>
                    <td class="text-end" th:text="${employee.plannedCost != null ? #numbers.formatDecimal(employee.plannedCost, 1, 'WHITESPACE', 2, 'COMMA') : '-'}">0</td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{__${adminBase}__/employees/{id}/edit(id=${employee.id})}">Edytuj</a>
                        <form th:action="@{__${adminBase}__/employees/{id}/delete(id=${employee.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Usunąć pracownika?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-outline-danger btn-sm">Usuń</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="6" class="text-muted text-center py-4">Brak pracowników.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: budget-footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
