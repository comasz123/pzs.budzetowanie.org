<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <title>Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container-fluid px-4 py-3">
    <div th:replace="~{fragments/admin :: header('Admin', ${activeSection})}"></div>

    <p class="text-muted small">Ostatnie 500 zdarzeń. Hasła nie są zapisywane. Dziennik zaczyna się od wdrożenia tej wersji.</p>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover table-sm mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Czas</th>
                    <th>IP</th>
                    <th>Przeglądarka</th>
                    <th>Kto</th>
                    <th>Zdarzenie</th>
                    <th>Szczegóły</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="event : ${events}">
                    <td class="text-nowrap" th:text="${#temporals.format(event.createdAt, 'dd.MM.yyyy HH:mm:ss')}">01.01.2026 12:00:00</td>
                    <td class="text-nowrap" th:text="${event.ip != null ? event.ip : '—'}">10.10.30.11</td>
                    <td class="small text-truncate" style="max-width: 16rem;" th:text="${event.userAgent != null ? event.userAgent : '—'}" th:title="${event.userAgent}">Chrome</td>
                    <td th:text="${event.username != null ? event.username : '—'}">email</td>
                    <td>
                        <span class="badge"
                              th:classappend="${event.type.name() == 'LOGIN_FAILURE'} ? 'text-bg-danger' : (${event.type.name() == 'LOGIN_SUCCESS'} ? 'text-bg-success' : (${event.type.name() == 'CHANGE'} ? 'text-bg-primary' : 'text-bg-secondary'))"
                              th:text="${event.type.label}">Zdarzenie</span>
                    </td>
                    <td class="small" th:text="${event.detail != null ? event.detail : '—'}">—</td>
                </tr>
                <tr th:if="${#lists.isEmpty(events)}">
                    <td colspan="6" class="text-muted text-center py-4">Brak zdarzeń.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: budget-footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
