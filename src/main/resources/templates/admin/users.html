<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <title>Użytkownicy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container-fluid px-4 py-3">
    <div th:replace="~{fragments/admin :: header('Użytkownicy', ${activeSection})}"></div>
    <div th:replace="~{fragments/alerts :: flash-messages}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white fw-semibold">Konta</div>
        <div class="table-responsive">
            <table class="table table-hover table-sm mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Imię i nazwisko</th>
                    <th>E-mail</th>
                    <th>Rola</th>
                    <th>Status</th>
                    <th class="text-end">Akcje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${(user.firstName != null ? user.firstName : '') + ' ' + (user.lastName != null ? user.lastName : '')}">Imię</td>
                    <td th:text="${user.email}">email</td>
                    <td>
                        <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" class="d-flex gap-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <select class="form-select form-select-sm" name="role" style="max-width: 10rem;">
                                <option th:each="label : ${roleLabels}"
                                        th:value="${label}"
                                        th:text="${label}"
                                        th:selected="${label == T(pl.ngo.budget.security.AppRoles).label(T(pl.ngo.budget.security.AppRoles).primary(user.roles))}">admin</option>
                            </select>
                            <button type="submit" class="btn btn-outline-secondary btn-sm">Zapisz</button>
                        </form>
                    </td>
                    <td>
                        <span class="badge" th:classappend="${user.enabled} ? 'bg-success' : 'bg-secondary'"
                              th:text="${user.enabled} ? 'Aktywne' : 'Wyłączone'">Aktywne</span>
                    </td>
                    <td class="text-end">
                        <form th:action="@{/admin/users/{id}/enabled(id=${user.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="enabled" th:value="${!user.enabled}"/>
                            <button type="submit" class="btn btn-outline-secondary btn-sm"
                                    th:text="${user.enabled} ? 'Wyłącz' : 'Włącz'">Wyłącz</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white fw-semibold">Nowe konto</div>
        <div class="card-body">
            <form th:action="@{/admin/users}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-md-3">
                    <label class="form-label">Imię</label>
                    <input class="form-control" name="firstName" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Nazwisko</label>
                    <input class="form-control" name="lastName" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">E-mail</label>
                    <input class="form-control" type="email" name="email" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Hasło</label>
                    <input class="form-control" type="password" name="password" minlength="8" required autocomplete="new-password">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Rola</label>
                    <select class="form-select" name="role" required>
                        <option value="read-only">read-only</option>
                        <option value="edit">edit</option>
                        <option value="admin">admin</option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Dodaj konto</button>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: budget-footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
