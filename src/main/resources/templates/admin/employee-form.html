<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <title th:text="${pageTitle}">Pracownik</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script th:src="@{/js/money-input.js}"></script>
</head>
<body class="bg-light">
<div class="container-fluid px-4 py-3">
    <div th:replace="~{fragments/admin :: header(${pageTitle}, ${activeSection})}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{__${adminBase}__/employees}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="id" th:value="${employee.id}"/>

                <div class="col-md-3">
                    <label class="form-label">Imię *</label>
                    <input class="form-control" name="firstName" required th:value="${employee.firstName}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Nazwisko *</label>
                    <input class="form-control" name="lastName" required th:value="${employee.lastName}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Stanowisko</label>
                    <input class="form-control" name="position" th:value="${employee.position}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Planowany koszt</label>
                    <input class="form-control money-input" type="text" inputmode="decimal" name="plannedCost"
                           th:value="${employee.plannedCost != null ? #numbers.formatDecimal(employee.plannedCost, 1, 'WHITESPACE', 2, 'COMMA') : ''}"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">E-mail</label>
                    <input class="form-control" type="email" name="email" th:value="${employee.email}"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Telefon</label>
                    <input class="form-control" name="phone" th:value="${employee.phone}"/>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Zapisz</button>
                    <a class="btn btn-outline-secondary" th:href="@{__${adminBase}__/employees}">Anuluj</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: budget-footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
