<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <title th:text="${pageTitle}">Sponsor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container-fluid px-4 py-3">
    <div th:replace="~{fragments/admin :: header(${pageTitle}, ${activeSection})}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{__${adminBase}__/sponsors}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="id" th:value="${sponsor.id}"/>

                <div class="col-md-8">
                    <label class="form-label">Nazwa *</label>
                    <input class="form-control" name="name" required th:value="${sponsor.name}"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Typ</label>
                    <input class="form-control" name="type" th:value="${sponsor.type}"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Ulica</label>
                    <input class="form-control" name="street" th:value="${sponsor.street}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Kod pocztowy</label>
                    <input class="form-control" name="postalCode" th:value="${sponsor.postalCode}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Miasto</label>
                    <input class="form-control" name="city" th:value="${sponsor.city}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Kraj</label>
                    <input class="form-control" name="country" th:value="${sponsor.country}"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">E-mail</label>
                    <input class="form-control" type="email" name="email" th:value="${sponsor.email}"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Telefon</label>
                    <input class="form-control" name="phone" th:value="${sponsor.phone}"/>
                </div>
                <div class="col-12">
                    <label class="form-label">Notatki</label>
                    <textarea class="form-control" name="notes" rows="3" th:text="${sponsor.notes}"></textarea>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Zapisz</button>
                    <a class="btn btn-outline-secondary" th:href="@{__${adminBase}__/sponsors}">Anuluj</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: budget-footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
