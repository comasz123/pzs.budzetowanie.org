<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <title th:text="${pageTitle}">Kontakt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container-fluid px-4 py-3">
    <div th:replace="~{fragments/admin :: header(${pageTitle}, ${activeSection})}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{__${adminBase}__/sponsor-contacts}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="id" th:value="${contact.id}"/>

                <div class="col-md-6">
                    <label class="form-label">Sponsor *</label>
                    <select class="form-select" name="sponsorId" required>
                        <option value="">— wybierz —</option>
                        <option th:each="s : ${sponsors}" th:value="${s.id}" th:text="${s.name}"
                                th:selected="${(contact.sponsor != null && contact.sponsor.id == s.id) || (defaultSponsorId != null && defaultSponsorId == s.id)}">Sponsor</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Imię *</label>
                    <input class="form-control" name="firstName" required th:value="${contact.firstName}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Nazwisko *</label>
                    <input class="form-control" name="lastName" required th:value="${contact.lastName}"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Stanowisko</label>
                    <input class="form-control" name="position" th:value="${contact.position}"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">E-mail</label>
                    <input class="form-control" type="email" name="email" th:value="${contact.email}"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Telefon</label>
                    <input class="form-control" name="phone" th:value="${contact.phone}"/>
                </div>
                <div class="col-12">
                    <label class="form-label">Notatki</label>
                    <textarea class="form-control" name="notes" rows="3" th:text="${contact.notes}"></textarea>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Zapisz</button>
                    <a class="btn btn-outline-secondary" th:href="@{__${adminBase}__/sponsors}">Anuluj</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: budget-footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
