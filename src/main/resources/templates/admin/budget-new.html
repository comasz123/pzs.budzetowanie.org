<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <title>Nowy budżet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container-fluid px-4 py-3">
    <div th:replace="~{fragments/admin :: header('Nowy budżet', ${activeSection})}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="h5 mb-3">Przygotowanie budżetu rocznego</h3>
                    <p class="text-muted">Wybierz rok i opcjonalnie skopiuj pozycje z istniejącego budżetu. Kreator przeprowadzi Cię przez plan roczny i rozbicie na miesiące.</p>
                    <form th:action="@{__${adminBase}__/budget/new/start}" method="post" class="row g-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="col-md-6">
                            <label class="form-label">Rok budżetowy *</label>
                            <input class="form-control" type="number" name="fiscalYear" required
                                   th:value="${nextYear}" min="2000" max="2100"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Kopiuj pozycje z roku</label>
                            <select class="form-select" name="copyFromYear">
                                <option value="">— bez kopiowania —</option>
                                <option th:each="y : ${existingYears}" th:value="${y}" th:text="${y}">2026</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary btn-lg">Przygotuj nowy budżet</button>
                            <a class="btn btn-outline-secondary" th:href="@{__${budgetBase}__}">Anuluj</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm mt-3 border-0 bg-white" th:if="${!#lists.isEmpty(existingYears)}">
                <div class="card-body">
                    <h6 class="fw-semibold">Istniejące lata budżetowe</h6>
                    <ul class="mb-0">
                        <li th:each="y : ${existingYears}">
                            <a th:href="@{__${budgetBase}__(year=${y})}" th:text="${y}">2026</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: budget-footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
