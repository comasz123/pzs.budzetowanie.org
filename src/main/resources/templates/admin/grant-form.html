<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <title th:text="${pageTitle}">Grant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script th:src="@{/js/money-input.js}"></script>
</head>
<body class="bg-light">
<div class="container-fluid px-4 py-3">
    <div th:replace="~{fragments/admin :: header(${pageTitle}, ${activeSection})}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{__${adminBase}__/grants}" th:object="${grantCommand}" method="post" class="row g-3" id="grantForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>

                <div class="col-md-3">
                    <label class="form-label" for="grantCode">Kod *</label>
                    <input class="form-control" id="grantCode" required th:field="*{code}"/>
                </div>
                <div class="col-md-9">
                    <label class="form-label" for="grantName">Nazwa *</label>
                    <input class="form-control" id="grantName" required th:field="*{name}"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="grantSponsor">Sponsor *</label>
                    <select class="form-select" id="grantSponsor" required th:field="*{sponsorId}">
                        <option value="">— wybierz —</option>
                        <option th:each="s : ${sponsors}" th:value="${s.id}" th:text="${s.name}">Sponsor</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="grantProject">Projekt *</label>
                    <select class="form-select" id="grantProject" required th:field="*{projectId}">
                        <option value="">— wybierz —</option>
                        <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}">Projekt</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="grantStartDate">Data rozpoczęcia</label>
                    <input class="form-control" id="grantStartDate" type="date" th:field="*{startDate}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="grantEndDate">Data zakończenia</label>
                    <input class="form-control" id="grantEndDate" type="date" th:field="*{endDate}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="grantTotalAmount">Kwota</label>
                    <input class="form-control money-input" id="grantTotalAmount" type="text" inputmode="decimal" th:field="*{totalAmount}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="grantCurrency">Waluta</label>
                    <input class="form-control" id="grantCurrency" th:field="*{currency}"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="grantPrimaryContact">Kontakt główny</label>
                    <select class="form-select" id="grantPrimaryContact" th:field="*{primarySponsorContactId}">
                        <option value="">— brak —</option>
                        <option th:each="c : ${contacts}" th:value="${c.id}"
                                th:text="${c.sponsor.name + ': ' + c.firstName + ' ' + c.lastName}">Kontakt</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="grantFinancialContact">Kontakt finansowy</label>
                    <select class="form-select" id="grantFinancialContact" th:field="*{financialSponsorContactId}">
                        <option value="">— brak —</option>
                        <option th:each="c : ${contacts}" th:value="${c.id}"
                                th:text="${c.sponsor.name + ': ' + c.firstName + ' ' + c.lastName}">Kontakt</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="grantCoordinator">Koordynator grantu</label>
                    <select class="form-select" id="grantCoordinator" th:field="*{grantCoordinatorId}">
                        <option value="">— brak —</option>
                        <option th:each="e : ${employees}" th:value="${e.id}"
                                th:text="${e.firstName + ' ' + e.lastName + (e.position != null ? ' (' + e.position + ')' : '')}">Pracownik</option>
                    </select>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="grantActive" th:field="*{active}"/>
                        <label class="form-check-label" for="grantActive">Aktywny</label>
                    </div>
                </div>

                <div class="col-12 mt-2">
                    <hr class="my-2"/>
                    <h2 class="h6 mb-3">Budżet</h2>
                    <div id="budgetItemSelects" class="d-flex flex-column gap-2 mb-2">
                        <div class="d-flex gap-2 align-items-center budget-item-select-row"
                             th:each="item, stat : *{budgetItems}">
                            <select class="form-select budget-item-select"
                                    th:name="|budgetItems[${stat.index}].templateId|">
                                <option value="">— wybierz pozycję —</option>
                                <option th:each="t : ${budgetTemplates}"
                                        th:value="${t.id}"
                                        th:selected="${item.templateId != null and item.templateId == t.id}"
                                        th:text="${t.name}">Pozycja</option>
                            </select>
                            <button type="button" class="btn btn-outline-danger btn-sm remove-budget-item" title="Usuń">×</button>
                        </div>
                    </div>
                    <button type="button" id="addBudgetItemBtn" class="btn btn-outline-primary btn-sm">Dodaj</button>
                    <p class="text-muted small mb-0 mt-2">Kliknij Dodaj, aby wybrać kolejną pozycję. Zapis kończy przycisk Zapisz.</p>
                </div>

                <div class="col-12 mt-2">
                    <hr class="my-2"/>
                    <h2 class="h6 mb-3">Transze</h2>
                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-2" id="tranchesTable">
                            <thead class="table-light">
                            <tr>
                                <th style="width: 6rem;">Transza</th>
                                <th>Data</th>
                                <th class="text-end">Kwota</th>
                                <th class="text-center" style="width: 6rem;">Przyszło</th>
                                <th style="width: 3rem;"></th>
                            </tr>
                            </thead>
                            <tbody id="tranchesBody">
                            <tr class="tranche-row" th:each="tranche, stat : *{tranches}">
                                <td>
                                    <input type="hidden" class="tranche-id"
                                           th:name="|tranches[${stat.index}].id|" th:value="${tranche.id}"/>
                                    <span class="tranche-label" th:text="|Transza ${stat.count}|">Transza 1</span>
                                </td>
                                <td>
                                    <input class="form-control form-control-sm tranche-planned-date" type="date"
                                           th:name="|tranches[${stat.index}].plannedDate|"
                                           th:value="${tranche.plannedDate}"/>
                                </td>
                                <td>
                                    <input class="form-control form-control-sm text-end tranche-planned-amount money-input" type="text" inputmode="decimal"
                                           th:name="|tranches[${stat.index}].plannedAmount|"
                                           th:value="${tranche.plannedAmount != null ? #numbers.formatDecimal(tranche.plannedAmount, 1, 'WHITESPACE', 2, 'COMMA') : ''}"/>
                                </td>
                                <td class="text-center">
                                    <input type="hidden" class="tranche-received-hidden"
                                           th:name="|tranches[${stat.index}].received|" value="false"/>
                                    <input class="form-check-input tranche-received" type="checkbox" value="true"
                                           th:name="|tranches[${stat.index}].received|"
                                           th:checked="${tranche.received}"/>
                                </td>
                                <td class="text-end">
                                    <button type="button" class="btn btn-outline-danger btn-sm remove-tranche" title="Usuń">×</button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <button type="button" id="addTrancheBtn" class="btn btn-outline-primary btn-sm">Dodaj transzę</button>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Zapisz</button>
                    <a class="btn btn-outline-secondary" th:href="@{__${adminBase}__/grants}">Anuluj</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: budget-footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
(() => {
    const budgetTemplates = /*[[${budgetTemplates}]]*/ [];
    const budgetContainer = document.getElementById('budgetItemSelects');
    const tranchesBody = document.getElementById('tranchesBody');
    const form = document.getElementById('grantForm');

    function budgetOptionsHtml(selectedId) {
        const selected = selectedId == null ? '' : String(selectedId);
        let html = '<option value="">— wybierz pozycję —</option>';
        for (const template of budgetTemplates) {
            const id = String(template.id);
            const name = template.name || '';
            html += `<option value="${id}" ${id === selected ? 'selected' : ''}>${escapeHtml(name)}</option>`;
        }
        return html;
    }

    function addBudgetSelect(selectedId) {
        const row = document.createElement('div');
        row.className = 'd-flex gap-2 align-items-center budget-item-select-row';
        row.innerHTML = `
            <select class="form-select budget-item-select">${budgetOptionsHtml(selectedId)}</select>
            <button type="button" class="btn btn-outline-danger btn-sm remove-budget-item" title="Usuń">×</button>`;
        budgetContainer.appendChild(row);
        reindexBudget();
        row.querySelector('select')?.focus();
    }

    function reindexBudget() {
        budgetContainer.querySelectorAll('.budget-item-select-row').forEach((row, index) => {
            const select = row.querySelector('select');
            if (select) {
                select.name = `budgetItems[${index}].templateId`;
            }
        });
    }

    function addTrancheRow() {
        const row = document.createElement('tr');
        row.className = 'tranche-row';
        row.innerHTML = `
            <td>
                <input type="hidden" class="tranche-id" value=""/>
                <span class="tranche-label"></span>
            </td>
            <td><input class="form-control form-control-sm tranche-planned-date" type="date"/></td>
            <td><input class="form-control form-control-sm text-end tranche-planned-amount money-input" type="text" inputmode="decimal"/></td>
            <td class="text-center">
                <input type="hidden" class="tranche-received-hidden" value="false"/>
                <input class="form-check-input tranche-received" type="checkbox" value="true"/>
            </td>
            <td class="text-end">
                <button type="button" class="btn btn-outline-danger btn-sm remove-tranche" title="Usuń">×</button>
            </td>`;
        tranchesBody.appendChild(row);
        reindexTranches();
        row.querySelector('.tranche-planned-date')?.focus();
    }

    function reindexTranches() {
        tranchesBody.querySelectorAll('.tranche-row').forEach((row, index) => {
            const label = row.querySelector('.tranche-label');
            if (label) {
                label.textContent = `Transza ${index + 1}`;
            }
            setName(row.querySelector('.tranche-id'), `tranches[${index}].id`);
            setName(row.querySelector('.tranche-planned-date'), `tranches[${index}].plannedDate`);
            setName(row.querySelector('.tranche-planned-amount'), `tranches[${index}].plannedAmount`);
            setName(row.querySelector('.tranche-received-hidden'), `tranches[${index}].received`);
            setName(row.querySelector('.tranche-received'), `tranches[${index}].received`);
        });
    }

    function setName(el, name) {
        if (el) {
            el.name = name;
        }
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    document.getElementById('addBudgetItemBtn')?.addEventListener('click', () => addBudgetSelect(''));
    document.getElementById('addTrancheBtn')?.addEventListener('click', addTrancheRow);

    budgetContainer.addEventListener('click', (event) => {
        const button = event.target.closest('.remove-budget-item');
        if (!button) {
            return;
        }
        button.closest('.budget-item-select-row')?.remove();
        reindexBudget();
    });

    tranchesBody.addEventListener('click', (event) => {
        const button = event.target.closest('.remove-tranche');
        if (!button) {
            return;
        }
        button.closest('tr')?.remove();
        reindexTranches();
    });

    form?.addEventListener('submit', () => {
        reindexBudget();
        reindexTranches();
        tranchesBody.querySelectorAll('.tranche-row').forEach((row) => {
            const checkbox = row.querySelector('.tranche-received');
            const hidden = row.querySelector('.tranche-received-hidden');
            if (hidden) {
                hidden.disabled = Boolean(checkbox?.checked);
            }
        });
    });

    if (budgetContainer.querySelectorAll('.budget-item-select-row').length === 0) {
        addBudgetSelect('');
    }
    reindexTranches();
})();
</script>
</body>
</html>
