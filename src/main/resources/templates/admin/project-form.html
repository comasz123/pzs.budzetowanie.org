<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <title th:text="${pageTitle}">Projekt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script th:src="@{/js/money-input.js}"></script>
</head>
<body class="bg-light">
<div class="container-fluid px-4 py-3">
    <div th:replace="~{fragments/admin :: header(${pageTitle}, ${activeSection})}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{__${adminBase}__/projects}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="col-md-3">
                    <label class="form-label">Kod</label>
                    <input class="form-control" name="code"/>
                </div>
                <div class="col-md-9">
                    <label class="form-label">Nazwa *</label>
                    <input class="form-control" name="name" required/>
                </div>
                <div class="col-12">
                    <label class="form-label">Opis</label>
                    <textarea class="form-control" name="description" rows="3"></textarea>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Data rozpoczęcia</label>
                    <input class="form-control" type="date" name="startDate"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Data zakończenia</label>
                    <input class="form-control" type="date" name="endDate"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Budżet całkowity</label>
                    <input class="form-control money-input" type="text" inputmode="decimal" name="totalBudget"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Koordynator</label>
                    <select class="form-select" name="grantCoordinatorId">
                        <option value="">— brak —</option>
                        <option th:each="e : ${employees}" th:value="${e.id}"
                                th:text="${e.firstName + ' ' + e.lastName}">Pracownik</option>
                    </select>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="active" value="true" id="projectActive" checked/>
                        <label class="form-check-label" for="projectActive">Aktywny</label>
                    </div>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Dodaj projekt</button>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: budget-footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
