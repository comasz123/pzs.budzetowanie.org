<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <title th:text="|Nowy budżet ${wizard.fiscalYear} – ${wizard.currentMonthName}|">Miesiąc</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script th:src="@{/js/money-input.js}"></script>
    <style>
        .wizard-scroll {
            max-height: calc(100vh - 14rem);
            overflow-y: auto;
        }
        .budget-wizard-table input.money-input {
            min-width: 7rem;
            text-align: right;
        }
        .budget-wizard-table td,
        .budget-wizard-table th {
            vertical-align: middle;
        }
        .category-header td {
            background: #f8f9fa;
            font-weight: 600;
            border-top: 2px solid #dee2e6;
        }
        .text-negative { color: #dc3545; font-weight: 600; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid px-4 py-3">
    <div th:replace="~{fragments/admin :: header('Nowy budżet', ${activeSection})}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
            <h1 class="h4 mb-1" th:text="|${wizard.currentMonthName} ${wizard.fiscalYear}|">Styczeń 2027</h1>
            <p class="text-muted small mb-0"
               th:text="|Krok ${wizard.currentMonth + 1} z 13 — rozbicie budżetu na miesiące.|">Krok 2 z 13</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{__${adminBase}__/budget/new/{year}/month/{month}/export(year=${wizard.fiscalYear}, month=${wizard.currentMonth})}">Excel</a>
            <a class="btn btn-outline-secondary btn-sm"
               th:if="${wizard.currentMonth > 1}"
               th:href="@{__${adminBase}__/budget/new/{year}/month/{month}(year=${wizard.fiscalYear}, month=${wizard.currentMonth - 1})}">← Poprzedni miesiąc</a>
        </div>
    </div>

    <form th:action="@{__${adminBase}__/budget/new/{year}/month/{month}(year=${wizard.fiscalYear}, month=${wizard.currentMonth})}"
          method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <span class="fw-semibold" th:text="|${wizard.currentMonthName}|">Styczeń</span>
                <button type="submit" class="btn btn-primary">Zapisz</button>
            </div>
            <div class="card-body p-0 wizard-scroll">
                <table class="table table-sm table-hover mb-0 budget-wizard-table">
                    <thead class="table-light sticky-top">
                    <tr>
                        <th style="min-width: 16rem;">Pozycja</th>
                        <th class="text-end" style="width: 10rem;">Planowany koszt</th>
                        <th class="text-end" style="width: 10rem;">Pozostało</th>
                    </tr>
                    </thead>
                    <tbody>
                    <th:block th:each="cat, catStat : ${wizard.categories}">
                        <tr class="category-header">
                            <td colspan="3" th:text="${cat.name}">Kategoria</td>
                        </tr>
                        <tr th:each="line, lineStat : ${cat.lines}">
                            <td th:text="${line.label}">Pozycja</td>
                            <td class="text-end">
                                <input type="hidden"
                                       th:name="|categories[${catStat.index}].lines[${lineStat.index}].annualAllocationId|"
                                       th:value="${line.allocationId}"/>
                                <input class="form-control form-control-sm money-input"
                                       type="text" inputmode="decimal"
                                       th:name="|categories[${catStat.index}].lines[${lineStat.index}].monthAmount|"
                                       th:value="${line.monthAmount != null ? #numbers.formatDecimal(line.monthAmount, 1, 'WHITESPACE', 2, 'COMMA') : ''}"/>
                            </td>
                            <td class="text-end"
                                th:classappend="${line.remainingAmount != null and line.remainingAmount.signum() < 0} ? 'text-negative' : ''"
                                th:text="${#numbers.formatDecimal(line.remainingAmount, 1, 'WHITESPACE', 2, 'COMMA')}">0,00</td>
                        </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
            <div class="card-footer bg-white text-end">
                <button type="submit" class="btn btn-primary">Zapisz</button>
            </div>
        </div>
    </form>
</div>
<div th:replace="~{fragments/footer :: budget-footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
