<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="budget-nav(active)">
    <style>
        .budget-nav-sticky {
            position: sticky;
            top: 0;
            z-index: 1040;
            background-color: #fff;
        }
        .budget-main-nav .nav-link,
        .budget-months-bar .nav-link {
            white-space: nowrap;
        }
        .budget-months-bar .nav-link {
            font-size: 0.875rem;
            padding: 0.35rem 0.65rem;
        }
        .budget-main-nav .nav-link.active,
        .budget-months-bar .nav-link.active,
        .budget-main-nav button.nav-link.active {
            text-decoration: underline;
            text-underline-offset: 0.3rem;
            text-decoration-thickness: 2px;
        }
        .budget-user-bar .btn-link {
            text-decoration: none;
        }
        .budget-user-bar .btn-link:hover {
            text-decoration: underline;
        }
        .password-change summary {
            list-style: none;
            cursor: pointer;
        }
        .password-change summary::-webkit-details-marker {
            display: none;
        }
        .password-change-form {
            position: absolute;
            left: 0;
            top: 100%;
            z-index: 1050;
            width: 16rem;
        }
    </style>
    <div class="budget-nav-sticky mb-4 border rounded shadow-sm bg-white">
        <nav class="navbar navbar-light budget-main-nav px-3 py-2 mb-0">
            <div class="container-fluid px-0 d-flex flex-wrap align-items-center gap-2">
                <ul class="nav flex-row flex-wrap gap-1 align-items-center mb-0">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" th:href="@{/}">Pulpit</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold"
                           th:classappend="${active == 'dashboard'} ? 'active text-primary' : ''"
                           th:href="@{__${budgetBase}__(year=${navYear})}">Budżet</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold"
                           th:classappend="${active == 'months'} ? 'active text-primary' : ''"
                           th:href="@{__${budgetBase}__/month(year=${navCurrentYear}, month=${navCurrentMonth})}">Miesiące</a>
                    </li>
                    <li class="nav-item" th:if="${budgetBase == '/realizacja'}">
                        <a class="nav-link fw-semibold"
                           th:classappend="${active == 'expenditures'} ? 'active text-primary' : ''"
                           th:href="@{/realizacja/wydatki(year=${navYear})}">Wydatki</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold"
                           th:classappend="${active == 'grants'} ? 'active text-primary' : ''"
                           th:href="@{__${adminBase}__/grants(year=${navYear})}">Granty</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold"
                           th:classappend="${active == 'sponsors'} ? 'active text-primary' : ''"
                           th:href="@{__${adminBase}__/sponsors}">Sponsorzy</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold"
                           th:classappend="${active == 'employees'} ? 'active text-primary' : ''"
                           th:href="@{__${adminBase}__/employees}">Pracownicy</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold"
                           th:classappend="${active == 'projects'} ? 'active text-primary' : ''"
                           th:href="@{__${adminBase}__/projects}">Projekty</a>
                    </li>
                    <li class="nav-item" th:if="${canEdit and budgetBase != '/realizacja'}">
                        <a class="nav-link fw-semibold"
                           th:classappend="${active == 'budget-new'} ? 'active text-primary' : ''"
                           th:href="@{__${adminBase}__/budget/new}">Nowy budżet</a>
                    </li>
                    <li class="nav-item" th:if="${isAdmin}">
                        <a class="nav-link fw-semibold"
                           th:classappend="${active == 'users'} ? 'active text-primary' : ''"
                           th:href="@{/admin/users}">Admin</a>
                    </li>
                </ul>
                <div class="budget-user-bar ms-md-auto small d-flex align-items-start gap-2"
                     sec:authorize="isAuthenticated()">
                    <span class="text-muted">Zalogowany:</span>
                    <div class="password-change position-relative d-flex flex-column align-items-start">
                        <span class="text-dark fw-semibold" th:text="${currentUserDisplay}">Jan Kowalski</span>
                        <details th:open="${passwordError != null}">
                            <summary class="btn btn-link btn-sm p-0 text-muted">Zmień hasło</summary>
                            <form class="password-change-form card shadow-sm border p-2 mt-1 bg-white"
                                  th:action="@{/account/password}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input class="form-control form-control-sm mb-1" type="password" name="currentPassword"
                                       placeholder="Obecne hasło" required autocomplete="current-password">
                                <input class="form-control form-control-sm mb-1" type="password" name="newPassword"
                                       placeholder="Nowe hasło" minlength="8" required autocomplete="new-password">
                                <input class="form-control form-control-sm mb-2" type="password" name="confirmPassword"
                                       placeholder="Powtórz nowe hasło" minlength="8" required autocomplete="new-password">
                                <button type="submit" class="btn btn-primary btn-sm">Zapisz</button>
                            </form>
                        </details>
                        <div th:if="${passwordMessage}" class="text-success" th:text="${passwordMessage}">Hasło zostało zmienione.</div>
                        <div th:if="${passwordError}" class="text-danger" th:text="${passwordError}">Błąd</div>
                    </div>
                    <form th:action="@{/logout}" method="post" class="mb-0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-link btn-sm p-0 text-muted">Wyloguj</button>
                    </form>
                </div>
            </div>
        </nav>
        <div id="budget-months-bar"
             class="budget-months-bar border-top px-3 py-2"
             th:classappend="${active == 'months'} ? '' : 'd-none'">
            <ul class="nav flex-row flex-wrap gap-1 align-items-center mb-0">
                <li class="nav-item" th:each="monthLabel, stat : ${monthNames}">
                    <a class="nav-link fw-semibold"
                       th:classappend="${active == 'months' && navMonth != null && navMonth == stat.count} ? 'active text-primary' : ''"
                       th:href="@{__${budgetBase}__/month(year=${navYear}, month=${stat.count})}"
                       th:text="${monthLabel}">Styczeń</a>
                </li>
            </ul>
        </div>
    </div>
</th:block>
</body>
</html>
