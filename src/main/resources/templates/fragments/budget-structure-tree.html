<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<ul th:fragment="nodes(items, depth, rootRowKey)" class="list-unstyled mb-0 structure-tree">
    <li th:each="item : ${items}" class="structure-node" th:attr="data-row-key=${item.rowKey}">
        <div class="structure-row d-flex flex-wrap align-items-center gap-2 py-2 border-bottom"
             th:classappend="${item.expense} ? 'is-expense' : 'is-category'"
             th:style="|padding-left:${depth * 1.75 + 0.5}rem|">
            <input th:if="${item.renamable}" type="text"
                   class="form-control form-control-sm structure-name flex-grow-1 border-0 bg-transparent"
                   style="min-width: 12rem; width: auto;"
                   title="Kliknij, aby zmienić nazwę"
                   th:value="${item.name}" th:attr="data-original=${item.name}, data-parent-row-key=${item.parentRowKey}, data-row-key=${item.rowKey}, data-category-id=${item.categoryTemplateId}"/>
            <span th:unless="${item.renamable}" class="flex-grow-1 px-2"
                  th:classappend="${item.expense} ? 'structure-expense-name' : 'structure-category-name'"
                  th:text="${item.name}">Pozycja</span>
            <select th:if="${item.expense && !item.personnel}" class="form-select form-select-sm structure-move"
                    style="width: 22rem; max-width: 100%;" title="Przenieś wydatek do innej kategorii"
                    th:attr="data-line-key=${item.lineKey}">
                <option th:each="target : ${structureNode.moveTargets}"
                        th:value="${target.rowKey}" th:text="${target.name}"
                        th:selected="${target.rowKey == item.parentRowKey}">Kategoria</option>
            </select>
            <div th:if="${item.employeeId != null}" class="d-flex align-items-center gap-1 small structure-period"
                 th:attr="data-employee-id=${item.employeeId}"
                 title="Okres pracy w budżecie: przycisk 12 rozpisuje pensję tylko na te miesiące">
                <span class="text-muted">od</span>
                <input type="date" class="form-control form-control-sm structure-period-from" style="width: 9.5rem;"
                       th:value="${item.periodFrom}"/>
                <span class="text-muted">do</span>
                <input type="date" class="form-control form-control-sm structure-period-to" style="width: 9.5rem;"
                       th:value="${item.periodTo}"/>
            </div>
            <div class="input-group input-group-sm" style="width: 9.5rem;">
                <input type="text"
                       inputmode="decimal"
                       class="form-control text-end structure-amount money-input"
                       placeholder="0,00"
                       th:disabled="${!#lists.isEmpty(item.children) || (item.personnel && !item.expense)}"
                       th:attr="data-parent-row-key=${item.parentRowKey}, data-row-key=${item.rowKey}, data-ids=${item.allocationIds}, data-kind=${item.editKind != 'subcategory' ? item.editKind : null}"
                       th:value="${item.plannedAmount != null ? #numbers.formatDecimal(item.plannedAmount, 1, 'WHITESPACE', 2, 'COMMA') : ''}"/>
                <span class="input-group-text">zł</span>
            </div>
            <button th:if="${item.editKind != null}" type="button"
                    class="btn btn-outline-secondary btn-sm structure-split12"
                    title="Rozpisz planowany koszt po równo na 12 miesięcy"
                    th:attr="data-kind=${item.editKind}, data-ids=${item.allocationIds}, data-parent-row-key=${item.parentRowKey}, data-row-key=${item.rowKey}">12</button>
            <button th:if="${item.expense && item.editKind != null && !item.personnel}" type="button"
                    class="btn btn-outline-danger btn-sm structure-line-delete"
                    title="Usuń wydatek"
                    th:attr="data-kind=${item.editKind}, data-ids=${item.allocationIds}, data-line-key=${item.lineKey}">×</button>
            <button th:if="${item.navigable}" type="button"
                    class="btn btn-outline-secondary btn-sm structure-add-toggle"
                    title="Dodaj podkategorię">＋</button>
            <form th:if="${item.deletable && item.categoryTemplateId != null}"
                  class="m-0 structure-delete-form"
                  th:action="@{__${budgetBase}__/categories/{id}/delete(id=${item.categoryTemplateId})}"
                  method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="year" th:value="${selectedYear}"/>
                <input type="hidden" name="structureRowKey" th:value="${rootRowKey}"/>
                <button type="submit" class="btn btn-outline-danger btn-sm" title="Usuń">×</button>
            </form>
            <form th:if="${item.deletable && item.categoryTemplateId == null}"
                  class="m-0 structure-delete-form"
                  th:action="@{__${budgetBase}__/subcategories/delete}"
                  method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="parentRowKey" th:value="${item.parentRowKey}"/>
                <input type="hidden" name="rowKey" th:value="${item.rowKey}"/>
                <input type="hidden" name="year" th:value="${selectedYear}"/>
                <input type="hidden" name="structureRowKey" th:value="${rootRowKey}"/>
                <button type="submit" class="btn btn-outline-danger btn-sm" title="Usuń">×</button>
            </form>
        </div>
        <form th:if="${item.navigable}" class="structure-add-form d-none align-items-center gap-2 py-2 border-bottom bg-light"
              th:style="|padding-left:${(depth + 1) * 1.75 + 0.5}rem|"
              th:action="@{__${budgetBase}__/subcategories}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="parentRowKey" th:value="${item.rowKey}"/>
            <input type="hidden" name="year" th:value="${selectedYear}"/>
            <input type="hidden" name="structureRowKey" th:value="${rootRowKey}"/>
            <input class="form-control form-control-sm" name="name" placeholder="Nazwa nowej podkategorii"
                   style="max-width: 18rem;" required/>
            <button type="submit" class="btn btn-sm btn-primary">Dodaj</button>
        </form>
        <ul th:if="${!#lists.isEmpty(item.children)}" class="list-unstyled mb-0"
            th:replace="~{fragments/budget-structure-tree :: nodes(${item.children}, ${depth + 1}, ${rootRowKey})}"></ul>
    </li>
</ul>
</body>
</html>
