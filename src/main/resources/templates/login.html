<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
    <title>Logowanie | System Budżetowy NGO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-slate-200">
        <h2 class="text-2xl font-bold text-slate-800 mb-2 text-center">System Budżetowy NGO</h2>
        <p class="text-sm text-slate-500 mb-6 text-center">Zaloguj się, aby uzyskać dostęp</p>

        <!-- Komunikat o błędzie -->
        <div th:if="${param.error}" class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-200">
            Nieprawidłowy e-mail lub hasło.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Adres E-mail</label>
                <input type="email" name="username" required 
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Hasło</label>
                <input type="password" name="password" required 
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex items-center gap-2">
                <input type="checkbox" name="remember-me" id="remember-me" checked
                       class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                <label for="remember-me" class="text-sm text-slate-600">Zapamiętaj mnie (nie wylogowuj po zamknięciu przeglądarki)</label>
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">
                Zaloguj się
            </button>
        </form>
    </div>
</body>
</html>
